name: Verify ClearPath
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  vision-and-api:
    name: Python 3.12 · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip check
      - run: node --check public/app.js
      - run: python -m pytest -q
      - run: python -m clearpath runtime
      - run: python -m clearpath evaluate
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: synthetic-evaluation-${{ matrix.os }}
          path: reports/*.json
          retention-days: 30
  linux-container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -t clearpath:ci .
      - name: Verify real OpenCV runtime and non-root container
        run: |
          test "$(docker run --rm --entrypoint id clearpath:ci -u)" = "10001"
          docker run --rm --entrypoint python clearpath:ci -m pip check
          docker run --rm --entrypoint python clearpath:ci -m clearpath runtime
      # This Linux build is local CI evidence, not an AWS deployment.
